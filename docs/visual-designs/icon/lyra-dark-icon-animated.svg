<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <title>Lyra Animated Icon</title>
  <style>
    .string-1 {
      animation: growUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
    }
    .string-2 {
      animation: growUp 0.42s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
    }
    .star-node {
      animation: starSnap 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) 0.42s both;
    }

    @keyframes growUp {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }
    @keyframes starSnap {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-90deg);
        fill: #FFFFFF;
      }
      60% {
        opacity: 1;
        fill: #FFFFFF;
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        fill: #EFF1F5;
      }
    }

    /* Automatically hide 4-point star at small sizes (48px / Favicon) */
    @media (max-width: 64px) {
      .star-group {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .string-1, .string-2, .star-node {
        animation: none;
      }
    }
  </style>

  <!-- Background -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Architectural L Monogram -->
  <path d="M136 102H180V366H376V406H136V102Z" fill="#FFFFFF" />

  <!-- Parallel Harp Strings (anchored at y=366 to grow bottom-to-top) -->
  <g transform="translate(205.5, 366)">
    <rect class="string-1" x="-7.5" y="-264" width="15" height="264" fill="#D2D8E2" />
  </g>
  <g transform="translate(238.5, 366)">
    <rect class="string-2" x="-7.5" y="-226" width="15" height="226" fill="#D2D8E2" />
  </g>

  <!-- Four-Point Star Node (centered at 283, 124) -->
  <g class="star-group" transform="translate(283, 124)">
    <path class="star-node" d="M0 -21L6.2 -6.2L21 0L6.2 6.2L0 21L-6.2 6.2L-21 0L-6.2 -6.2Z" fill="#EFF1F5" />
  </g>
</svg>